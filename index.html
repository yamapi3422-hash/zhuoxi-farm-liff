<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卓溪小農 - 線上訂購系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen pb-12">
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md p-5">
    <header class="border-b pb-4 mb-5 text-center">
      <h1 class="text-2xl font-bold text-emerald-800">🌿 卓溪小農線上訂購</h1>
      <p class="text-xs text-stone-500 mt-1">產地直達・新鮮品質</p>
    </header>

    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-600 border-t-transparent"></div>
      <p class="text-sm text-stone-500 mt-2">正在載入您的資料與商品選單...</p>
    </div>

    <form id="orderForm" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">訂購人姓名</label>
        <input type="text" id="name" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">聯絡電話</label>
        <input type="tel" id="phone" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">寄件地址</label>
        <textarea id="address" rows="2" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
      </div>

      <hr class="my-4 border-dashed">

      <!-- 商品列表選購區 -->
      <div>
        <label class="block text-sm font-semibold mb-2">選擇商品與數量</label>
        <div id="productList" class="space-y-3"></div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1 mt-4">預計出貨週次</label>
        <select id="shipWeek" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="下週出貨">下週出貨</option>
          <option value="本月中旬">本月中旬</option>
          <option value="本月底">本月底</option>
        </select>
      </div>

      <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 space-y-1 my-3">
        <p class="font-bold text-sm text-amber-800 mb-1">💳 匯款資訊：</p>
        <p>【銀行代碼】806 元大商業銀行 （淡水分行）</p>
        <p>【帳號】2-126-2-00006951-7</p>
        <p>【戶名】汪冠宏</p>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">轉帳帳號後 5 碼</label>
        <input type="text" id="payLast5" maxlength="5" placeholder="例如：12345" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>

      <!-- 金額試算區 -->
      <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 mt-4 space-y-1.5">
        <div class="flex justify-between text-sm text-stone-600">
          <span>商品小計：</span>
          <span id="subtotalText">NT$ 0</span>
        </div>
        
        <div id="discountRow" class="flex justify-between text-sm text-amber-700 font-medium hidden">
          <span id="discountTitle">滿額折扣：</span>
          <span id="discountText">- NT$ 0</span>
        </div>

        <div id="shippingRow" class="flex justify-between text-sm text-stone-600">
          <span>預估運費：</span>
          <span id="shippingText">NT$ 180</span>
        </div>

        <div class="flex justify-between font-bold text-lg text-emerald-900 border-t border-emerald-200 pt-2 mt-2">
          <span>總計金額：</span>
          <span id="totalText">NT$ 0</span>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 mt-6">
        確認送出訂單
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2011111006-ozQwHNo2"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyHGBn0s6zYUV4PRRxZbsELbWPtAeL5VsreF5PbSAsm0CBH95O-WbYhcWAGZEUJrZaw/exec"; 

    let currentUserProfile = null;
    let productsList = [];
    let quantities = {};
    let storeConfig = {
      shippingFee: 180,
      freeShippingThreshold: 3000,
      discountThreshold: 0,
      discountRate: 1
    };

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        currentUserProfile = await liff.getProfile();
        await loadInitialData(currentUserProfile.userId);
      } catch (err) {
        alert("LIFF 初始化失敗：" + err.message);
      }
    }

    async function loadInitialData(userId) {
      try {
        const res = await fetch(`${GAS_URL}?userId=${userId}`);
        const data = await res.json();

        if (data.status === 'success') {
          productsList = data.products;
          if (data.config) storeConfig = data.config;

          productsList.forEach((_, index) => {
            quantities[index] = 0;
          });

          renderProducts(productsList);

          if (data.customer) {
            document.getElementById('name').value = data.customer.name || currentUserProfile.displayName;
            document.getElementById('phone').value = data.customer.phone || '';
            document.getElementById('address').value = data.customer.address || '';
          } else {
            document.getElementById('name').value = currentUserProfile.displayName;
          }

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('orderForm').classList.remove('hidden');
          calculateTotal();
        }
      } catch (err) {
        alert("讀取資料失敗，請重新載入！");
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('productList');
      container.innerHTML = products.map((p, index) => `
        <div class="flex items-center justify-between p-3.5 bg-stone-50 rounded-xl border border-stone-200">
          <div>
            <div class="font-bold text-stone-800 text-sm">
              ${p.name} <span class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded ml-1">${p.grade}級</span>
            </div>
            <div class="text-xs text-stone-500 mt-1">
              ${p.spec}斤/箱 · <span class="font-bold text-emerald-800">NT$ ${p.price}</span>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button type="button" onclick="changeQty(${index}, -1)" class="w-8 h-8 rounded-lg bg-stone-200 text-stone-700 font-bold text-lg flex items-center justify-center hover:bg-stone-300 active:bg-stone-400">-</button>
            <input type="number" id="qty-${index}" value="0" min="0" onchange="onQtyInput(${index}, this.value)" class="w-10 text-center border rounded-lg p-1 text-sm font-bold bg-white outline-none">
            <button type="button" onclick="changeQty(${index}, 1)" class="w-8 h-8 rounded-lg bg-emerald-700 text-white font-bold text-lg flex items-center justify-center hover:bg-emerald-800 active:bg-emerald-900">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(index, delta) {
      const current = quantities[index] || 0;
      const updated = Math.max(0, current + delta);
      quantities[index] = updated;
      document.getElementById(`qty-${index}`).value = updated;
      calculateTotal();
    }

    function onQtyInput(index, value) {
      const parsed = Math.max(0, parseInt(value) || 0);
      quantities[index] = parsed;
      document.getElementById(`qty-${index}`).value = parsed;
      calculateTotal();
    }

    function calculateTotal() {
      let subtotal = 0;
      productsList.forEach((p, index) => {
        const qty = quantities[index] || 0;
        subtotal += p.price * qty;
      });

      let discount = 0;
      if (storeConfig.discountThreshold > 0 && storeConfig.discountRate < 1 && storeConfig.discountRate > 0 && subtotal >= storeConfig.discountThreshold) {
        discount = Math.round(subtotal * (1 - storeConfig.discountRate));
      }

      const baseShipping = storeConfig.shippingFee > 0 ? storeConfig.shippingFee : 180;
      let shippingFee = baseShipping;

      if (storeConfig.freeShippingThreshold > 0 && subtotal >= storeConfig.freeShippingThreshold) {
        shippingFee = 0;
      }

      const total = subtotal > 0 ? subtotal - discount + shippingFee : 0;

      document.getElementById('subtotalText').innerText = `NT$ ${subtotal}`;

      const discountRow = document.getElementById('discountRow');
      if (discount > 0) {
        discountRow.classList.remove('hidden');
        document.getElementById('discountText').innerText = `- NT$ ${discount}`;
      } else {
        discountRow.classList.add('hidden');
      }

      const shippingTextEl = document.getElementById('shippingText');
      if (subtotal > 0 && storeConfig.freeShippingThreshold > 0 && subtotal >= storeConfig.freeShippingThreshold) {
        shippingTextEl.innerText = "NT$ 0 (滿額免運)";
      } else {
        shippingTextEl.innerText = `NT$ ${baseShipping}`;
      }

      document.getElementById('totalText').innerText = `NT$ ${total}`;
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const items = [];
      let subtotal = 0;

      productsList.forEach((p, index) => {
        const boxes = quantities[index] || 0;
        if (boxes > 0) {
          items.push({
            productName: p.name,
            grade: p.grade,
            spec: p.spec,
            price: p.price,
            boxes: boxes
          });
          subtotal += p.price * boxes;
        }
      });

      if (items.length === 0) {
        alert("⚠️ 請至少選擇一種商品的數量！");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "訂單處理中...";

      let discount = 0;
      if (storeConfig.discountThreshold > 0 && storeConfig.discountRate < 1 && storeConfig.discountRate > 0 && subtotal >= storeConfig.discountThreshold) {
        discount = Math.round(subtotal * (1 - storeConfig.discountRate));
      }

      const baseShipping = storeConfig.shippingFee > 0 ? storeConfig.shippingFee : 180;
      let shippingFee = baseShipping;
      if (storeConfig.freeShippingThreshold > 0 && subtotal >= storeConfig.freeShippingThreshold) {
        shippingFee = 0;
      }

      const totalAmount = subtotal - discount + shippingFee;

      const payload = {
        userId: currentUserProfile.userId,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        shipWeek: document.getElementById('shipWeek').value,
        payLast5: document.getElementById('payLast5').value,
        subtotal: subtotal,
        discount: discount,
        shippingFee: shippingFee,
        totalAmount: totalAmount,
        items: items
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          alert(`🎉 訂單已順利送出！\n訂單編號：${result.orderId}`);
          liff.closeWindow();
        } else {
          alert("下單失敗：" + result.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "確認送出訂單";
        }
      } catch (err) {
        alert("網路連線異常，請稍後再試！");
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出訂單";
      }
    });

    window.onload = initLIFF;
  </script>
</body>
</html>
